<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; font: 13px system-ui, sans-serif; }
  body { width: 380px; margin: 0; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid #8885; }
  header label { display: flex; align-items: center; gap: 6px; }
  .grow { flex: 1; }
  #conns { width: 3.4em; }
  #list { max-height: 380px; overflow: auto; }
  .job { padding: 8px 12px; border-bottom: 1px solid #8883; }
  .top { display: flex; align-items: center; gap: 4px; }
  .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  progress { width: 100%; height: 6px; margin: 4px 0 2px; }
  .sub { color: #888; font-size: 11px; }
  .err { color: #d33; }
  .empty { padding: 28px 12px; text-align: center; color: #888; }
  button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; padding: 2px 5px; border-radius: 4px; }
  button:hover { background: #8883; }
  footer { padding: 6px 12px; text-align: right; }
</style>
<header>
  <label><input type="checkbox" id="on"> Capture downloads</label>
  <span class="grow"></span>
  <label title="Parallel connections per download">Connections <input type="number" id="conns" min="1" max="16"></label>
</header>
<div id="list"></div>
<footer><button id="clear">Clear finished</button></footer>
<script src="popup.js"></script>
