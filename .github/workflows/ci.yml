name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: swift test
      - name: Borno app builds (universal, signed ad hoc)
        run: ./bundle.sh borno app
      - name: Adwall app builds
        run: ./bundle.sh adwall app
      - name: Prompter app builds
        run: ./bundle.sh prompter app
      - name: Toolkit (unified app) builds
        run: ./bundle.sh toolkit app
