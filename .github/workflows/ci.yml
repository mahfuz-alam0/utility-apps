name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: swift test
        env:
          SWIFT_BACKTRACE: enable=yes,color=no  # a crash prints its stack, not just "signal code 5"
      - name: Borno app builds (universal, signed ad hoc)
        run: ./bundle.sh borno app
      - name: Adwall app builds
        run: ./bundle.sh adwall app
      - name: Prompter app builds
        run: ./bundle.sh prompter app
