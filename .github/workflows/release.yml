name: Release
# Push a tag (git tag v0.1.0 && git push origin v0.1.0) to build every app and publish the dmgs.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build number = git commit count
      - name: Tests
        run: swift test
      - name: Build all dmgs (the four apps + Toolkit)
        run: for a in clipboard prompter adwall borno toolkit; do ./bundle.sh $a; done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build
          gh release create "$GITHUB_REF_NAME" ClipboardManager.dmg Prompter.dmg Adwall.dmg Borno.dmg Toolkit.dmg \
            --generate-notes \
            --notes "Builds are ad-hoc signed, not notarized. First open: right-click the app, then Open. Toolkit contains all four apps; the other dmgs install one each."
